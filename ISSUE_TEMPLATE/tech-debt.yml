name: Tech debt
description: Code that works but costs us later
labels: [tech-debt]
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: Folder, file or feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What and why it costs
    validations:
      required: true
  - type: input
    id: exception
    attributes:
      label: Exception it removes (optional)
      description: e.g. a lint or architecture exception this would make unnecessary.
