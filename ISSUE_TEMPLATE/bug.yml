name: Bug
description: Something doesn't work as it should
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: The app or tool version where it happens.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: Screenshots welcome — never with someone else's personal data, keys or tokens.
    validations:
      required: true
